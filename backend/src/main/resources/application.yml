spring:
  application:
    name: artlog
  datasource:
    url: jdbc:postgresql://localhost:5432/artlog
    username: ${DB_USERNAME:artlog}
    password: ${DB_PASSWORD:artlog}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  graphql:
    graphiql:
      enabled: true

server:
  port: 8080

artlog:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
