spring:
  application:
    name: artlog
  datasource:
    url: jdbc:postgresql://localhost:5432/artlog
    username: ${DB_USERNAME:artlog}
    password: ${DB_PASSWORD:artlog}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  graphql:
    graphiql:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

artlog:
  frontend-origin-pattern: ${FRONTEND_ORIGIN_PATTERN:http://localhost:*}
  upload-dir: ${UPLOAD_DIR:uploads}
