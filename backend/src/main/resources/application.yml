spring:
  application:
    name: artlog
  config:
    # Local secrets/overrides (gitignored); see .env.example. Real env vars still take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/artlog
    username: ${DB_USERNAME:artlog}
    password: ${DB_PASSWORD:artlog}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  graphql:
    graphiql:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

artlog:
  frontend-origin-pattern: ${FRONTEND_ORIGIN_PATTERN:http://localhost:*}
  storage: ${IMAGE_STORAGE:local}  # local | cloudinary
  upload-dir: ${UPLOAD_DIR:uploads}  # local storage only
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}  # local storage only
  cloudinary-url: ${CLOUDINARY_URL:}  # cloudinary storage only
